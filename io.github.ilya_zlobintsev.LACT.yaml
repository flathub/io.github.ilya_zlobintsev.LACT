app-id: io.github.ilya_zlobintsev.LACT
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: startup.sh
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=/run/lactd.sock
cleanup:
  - /include
  - /share/vulkan/registry
  - '*.a'
  - /lib/pkgconfig
modules:
  - name: vulkan-tools
    buildsystem: cmake-ninja
    config-opts:
      - -DVULKAN_HEADERS_INSTALL_DIR=/app
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_CUBE=OFF
      - -DBUILD_ICD=OFF
      - -DBUILD_VULKANINFO=ON
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/Vulkan-Tools/archive/v1.4.359/Vulkan-Tools-1.4.359.tar.gz
        sha256: 64b7e72d8838348be97f2f04b2757469ac828676376dbbd671165a0bb21194a5
        x-checker-data:
          type: anitya
          project-id: 242111
          url-template: https://github.com/KhronosGroup/Vulkan-Tools/archive/v$version/Vulkan-Tools-$version.tar.gz
    modules:
      - name: volk
        buildsystem: cmake-ninja
        config-opts:
          - -DVOLK_INSTALL=ON
        sources:
          - type: archive
            url: https://github.com/zeux/volk/archive/vulkan-sdk-1.4.357.0.tar.gz
            sha256: 6400c7b23e24d17e4f04bac49b55b06c4e87677d33398e90344743ec73560ca6
            x-checker-data:
              type: anitya
              project-id: 370476
              url-template: https://github.com/zeux/volk/archive/vulkan-sdk-$version.tar.gz
        modules:
          - name: vulkan-headers
            buildsystem: cmake-ninja
            sources:
              - type: archive
                url: https://github.com/KhronosGroup/Vulkan-Headers/archive/v1.4.359/Vulkan-Headers-v1.4.359.tar.gz
                sha256: f655ccd3098d1d999c42dfcf3c7491c6e36fb02c886efece2d2470f7a3b57752
                x-checker-data:
                  type: anitya
                  project-id: 88835
                  url-template: https://github.com/KhronosGroup/Vulkan-Headers/archive/v$version/Vulkan-Headers-v$version.tar.gz


  - name: clinfo
    no-autogen: true
    no-make-install: true
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS PREFIX=$FLATPAK_DEST install
      - chmod 755 $FLATPAK_DEST/bin/clinfo
    sources:
      - type: archive
        url: https://github.com/Oblomov/clinfo/archive/3.0.25.02.14/clinfo-3.0.25.02.14.tar.gz
        sha256: 48b77dc33315e6f760791a2984f98ea4bff28504ff37d460d8291585f49fcd3a
        x-checker-data:
          type: anitya
          project-id: 10503
          url-template: https://github.com/Oblomov/clinfo/archive/$version/clinfo-$version.tar.gz
    modules:
      - name: opencl-headers
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_INSTALL_DATADIR=/app/lib
        sources:
          - type: archive
            url: https://github.com/KhronosGroup/OpenCL-Headers/archive/v2026.05.29/OpenCL-Headers-v2026.05.29.tar.gz
            sha256: d9e6c48357de5002da11ce45de600e0c3ffe6ab4f628a3b9fe2b38603161658a
            x-checker-data:
              type: anitya
              project-id: 223257
              url-template: https://github.com/KhronosGroup/OpenCL-Headers/archive/v$version/OpenCL-Headers-v$version.tar.gz

  - name: flatbox
    buildsystem: simple
    build-commands:
      - install -Dm755 flatbox -t /app/bin/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/ilya-zlobintsev/flatbox/releases/download/v0.0.12/flatbox-Linux-musl-x86_64.tar.gz
        strip-components: 0
        sha256: de32e42d27fce5113d3e3148d2bfee8020cc180df4c365c92efde27d02fc398e
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/ilya-zlobintsev/flatbox/releases/download/v0.0.12/flatbox-Linux-musl-arm64.tar.gz
        strip-components: 0
        sha256: a32ededf08fca1b0c075401ec400881539156c12b97f10f62a17803f1b9d304b

  - name: hwdata
    config-opts:
      - --datarootdir=/app/share
    sources:
      - type: git
        url: https://github.com/vcrhonek/hwdata.git
        tag: v0.410
        commit: 8bb6c48dc2e683777e625d1c9ef02c1b25b741cd
        x-checker-data:
          type: git

  - name: libdisplay-info
    buildsystem: meson
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.4.0/libdisplay-info-0.4.0.tar.gz
        sha256: 787b58aec473830b0030251ba2b880560b4b3853dc5d6961a6e9701abae29b55
        x-checker-data:
          type: anitya
          project-id: 326668
          stable-only: true
          url-template: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/$version/libdisplay-info-$version.tar.gz

  - name: lact
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/ilya-zlobintsev/LACT/archive/refs/tags/v0.10.0.tar.gz
        sha256: 4bb1a5066fe2071acee72b0c813e087c9a3060bc35f5e3ec4909fb4cb3e69ea0
        x-checker-data:
          type: anitya
          project-id: 372202
          url-template: https://github.com/ilya-zlobintsev/LACT/archive/refs/tags/v$version.tar.gz
          is-main-source: true
      - generated-sources.json

    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        CARGO_HOME: /run/build/lact/cargo
        PREFIX: /app
        VERGEN_GIT_SHA: b65ae69
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build -p lact --release
      - make install
      - install -Dm755 flatpak/startup.sh /app/bin/startup.sh
      - install -Dm755 flatpak/daemon.sh /app/bin/daemon.sh
      - desktop-file-edit --set-key Exec --set-value startup.sh /app/share/applications/io.github.ilya_zlobintsev.LACT.desktop
    modules:
      - name: yad
        config-opts:
          - --enable-standalone
          - --disable-icon-browser
          - --disable-tools
        sources:
          - type: archive
            url: https://github.com/v1cont/yad/releases/download/v15.0/yad-15.0.tar.xz
            sha256: 7cf4dc136a643bf484ceab27d9b28a513624dffe38a08731132c0e4e24073772
            x-checker-data:
              type: anitya
              project-id: 5280
              url-template: https://github.com/v1cont/yad/releases/download/v$version/yad-$version.tar.xz
        cleanup:
          - /share/icons
        modules:
          - shared-modules/intltool/intltool-0.51.json

